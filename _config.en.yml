# ============================================
# English Site Configuration
# Used for dual-build: hexo g --config _config.en.yml
# ============================================

# Site
title: 'CDP Automation Guide'
subtitle: 'Chrome DevTools Protocol Tutorials & Practical Guides'
description: 'Chrome DevTools Protocol (CDP) tutorials — control Chrome with Python for browser automation, screenshots, network interception, anti-detection, and performance analysis.'
language: en
timezone: Asia/Shanghai

# Source & Output
source_dir: source_en
public_dir: public-en

# URL
url: https://cdp.autify.cc
root: /en/
permalink: :title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory (same structure as main config)
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: cdp
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Theme
theme: butterfly

# Deployment (not used directly — build script handles this)
deploy:
  type:

# Feed (same as main)
feed:
  enable: true
  type: atom
  path: atom.xml
  limit: 20

# Sitemap
sitemap:
  path: sitemap.xml
  rel: true

# SEO
seo:
  sitemap:
    yoast: true
    gnews: true
  schema:
    article: true
    breadcrumb: true
    sitelink: true
    homepage: true
  links:
    enable: true

# ---------- Theme Overrides (English) ----------
theme_config:
  menu:
    Home: / || fas fa-home
    Archives: /archives/ || fas fa-archive
    Categories: /categories/ || fas fa-folder-open
    Tags: /tags/ || fas fa-tags
    About: /about/ || fas fa-info-circle
  aside:
    card_author:
      description: Chrome DevTools Protocol Tutorial
      button:
        text: Follow me
    card_announcement:
      content: 📢 CDP Automation Guide is a Chinese tech blog focused on Chrome DevTools Protocol, providing hands-on tutorials for controlling browsers with Python.
  footer:
    custom_text: 🚀 CDP Automation Guide
