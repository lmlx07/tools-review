# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: CDP 自动化指南
subtitle: Chrome DevTools Protocol 中文教程与实战
description: Chrome DevTools Protocol（CDP）中文教程，用 Python 控制浏览器实现自动化操作，涵盖爬虫、截图、RPA 等实战场景
keywords:
  - Chrome DevTools Protocol
  - CDP 教程
  - 浏览器自动化
  - Python 控制浏览器
  - CDP Python
author: ''
language: zh-CN
timezone: Asia/Shanghai

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://cdp.autify.cc
permalink: :title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: cdp
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# RSS Feed
feed:
  enable: true
  type: atom
  path: atom.xml
  limit: 20

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: butterfly

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: git
  repo: https://github.com/lmlx07/tools-review.git
  branch: gh-pages
  message: 'Site updated: {{ now("YYYY-MM-DD HH:mm:ss") }}'

# ====== SEO 插件配置 ======
seo:
  sitemap:
    yoast: true          # 生成 Yoast 式多文件 Sitemap
    gnews: true          # 生成 Google News Sitemap
  schema:
    article: true        # 文章结构化数据
    breadcrumb: true     # 面包屑导航
    sitelink: true       # 站点链接结构化
    homepage: true       # 首页结构化
  links:
    enable: true         # 外链自动 nofollow
